; Production PHP settings for the delivery backend.
; Hardened for PHP2Shell (CVE-2026-109618 / CVE-2026-109619): run PHP >= 8.4.27,
; keep request size limits tight and session upload progress disabled.
; Local-only overrides live in docker/php.local.ini (Dockerfile.local).

expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED

memory_limit=512M

; Largest single upload in the app is 20 MB (branch agreements); branch creation
; can send up to 5 x 10 MB documents in one request, so keep post_max_size at 64M.
upload_max_filesize=20M
post_max_size=64M
max_file_uploads=20
max_input_vars=1000
max_input_nesting_level=64

max_execution_time=300
max_input_time=60

; CVE-2026-109619 mitigation (session upload-progress path). Not used by Laravel.
session.upload_progress.enabled=0

date.timezone=Asia/Kathmandu

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0